<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTF Local Chat Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #18181b; color: #f4f4f5; margin: 0; padding: 0; display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #09090b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 15px; }
        .new-chat-btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .new-chat-btn:hover { background: #1d4ed8; }
        .log-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .log-item { padding: 10px; background: #27272a; border-radius: 6px; cursor: pointer; font-size: 0.85rem; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .log-item:hover { background: #3f3f46; }

        /* Chat Main Box */
        .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #27272a; background: #09090b; font-weight: 600; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Message Bubbles */
        .message-row { display: flex; flex-direction: column; max-width: 80%; }
        .message-row.user { align-self: flex-end; }
        .message-row.model { align-self: flex-start; }
        
        .bubble { padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; }
        .user .bubble { background: #2563eb; color: #ffffff; }
        .model .bubble { background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; }
        
        .sender-tag { font-size: 0.7rem; color: #a1a1aa; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }

        /* Input Controls */
        .input-area { padding: 20px; background: #09090b; border-top: 1px solid #27272a; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 14px; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #fff; outline: none; }
        button.send-btn { padding: 14px 24px; background: #22c55e; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
    <div style="font-size: 0.8rem; color: #888; margin-bottom: 8px;">SAVED RTF CHATS</div>
    <div class="log-list" id="log-list"></div>
</div>

<div class="chat-area">
    <div class="chat-header" id="chat-header">Active Chat</div>
    <div class="chat-box" id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchLogs();
        startNewChat();
    });

    async function fetchLogs() {
        const res = await fetch("/api/logs");
        const data = await res.json();
        const listContainer = document.getElementById("log-list");
        listContainer.innerHTML = "";

        data.files.forEach(file => {
            const item = document.createElement("div");
            item.className = "log-item";
            item.innerText = file;
            item.onclick = () => loadLog(file);
            listContainer.appendChild(item);
        });
    }

    async function startNewChat() {
        const res = await fetch("/api/new_chat", { method: "POST" });
        const data = await res.json();
        document.getElementById("chat-box").innerHTML = "";
        document.getElementById("chat-header").innerText = `Session: ${data.filename}`;
        fetchLogs();
    }

    async function loadLog(filename) {
        const res = await fetch(`/api/logs/${filename}`);
        const data = await res.json();
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML = "";
        document.getElementById("chat-header").innerText = `Loaded RTF: ${filename}`;

        data.turns.forEach(turn => {
            if (turn.user) appendBubble("user", "--- USER ---", turn.user);
            if (turn.model) appendBubble("model", "--- MODEL ---", turn.model);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendBubble(role, label, text) {
        const chatBox = document.getElementById("chat-box");
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        row.innerHTML = `
            <div class="sender-tag">${label}</div>
            <div class="bubble">${marked.parse(text)}</div>
        `;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return row;
    }

    async function sendMessage() {
        const inputElem = document.getElementById("user-input");
        const prompt = inputElem.value.trim();
        if (!prompt) return;

        appendBubble("user", "--- USER ---", prompt);
        inputElem.value = "";

        const tempModelRow = appendBubble("model", "--- MODEL ---", "<em>Generating response...</em>");

        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: prompt })
        });

        const data = await res.json();
        tempModelRow.querySelector(".bubble").innerHTML = marked.parse(data.response);
        fetchLogs();
    }
</script>

</body>
</html>
